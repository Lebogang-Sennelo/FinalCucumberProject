name: Cucumber profile-picture tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

jobs:
  cucumber:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_USERNAME: laylayt@gmail.com
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      PROFILE_PICTURE_BASE64: ${{ secrets.PROFILE_PICTURE_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Prepare private profile-picture test data
        run: |
          test -n "$PROFILE_PICTURE_BASE64" || {
            echo "::error::Add the PROFILE_PICTURE_BASE64 Actions secret."
            exit 1
          }
          mkdir -p target/test-data
          printf '%s' "$PROFILE_PICTURE_BASE64" | base64 --decode > target/test-data/profile-picture-source.jpg
          echo "PROFILE_PICTURE_PATH=target/test-data/profile-picture-source.jpg" >> "$GITHUB_ENV"
      - name: Run Cucumber tests
        run: mvn --batch-mode --no-transfer-progress test
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-and-screenshots
          path: |
            target/cucumber-reports/
            target/screenshots/
            target/surefire-reports/
          if-no-files-found: warn
